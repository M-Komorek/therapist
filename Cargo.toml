[package]
name = "therapist"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "A blazingly fast terminal log viewer: open multi-GB logs at once, move with vim keys, and narrow them down with cascading grep tabs, search, bookmarks and highlights."
license = "MIT"
repository = "https://github.com/M-Komorek/therapist"
keywords = ["log-viewer", "tui", "grep", "vim", "terminal"]
categories = ["command-line-utilities", "development-tools::debugging"]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[[bin]]
name = "thr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
memchr = "2"
ratatui = "0.30"
rustix = { version = "1", features = ["process"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
